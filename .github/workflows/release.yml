# Builds FunkyLauncher.exe from source on GitHub's servers.
# - Manual run (Actions → "Build and release" → Run workflow): builds and keeps the exe as an artifact.
# - A version tag (v0.1.2, ...): also creates a DRAFT release with the exe; it is published by hand after review.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build single-file launcher (no .NET needed on the player's PC)
        run: >
          dotnet publish src/FunkyLauncher -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:ContinuousIntegrationBuild=true
          -o out

      - name: SHA-256 of the exe
        shell: pwsh
        run: (Get-FileHash out/FunkyLauncher.exe -Algorithm SHA256).Hash | Tee-Object out/FunkyLauncher.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FunkyLauncher
          path: |
            out/FunkyLauncher.exe
            out/FunkyLauncher.exe.sha256

      - name: Draft release with the exe
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "Funky Launcher $($tag.TrimStart('v'))" --notes "Built by GitHub Actions from tag $tag."
          }
          gh release upload $tag out/FunkyLauncher.exe out/FunkyLauncher.exe.sha256 --clobber
